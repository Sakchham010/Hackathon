[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-model-router"
version = "0.1.0"
description = "Passive telemetry, task classification, and outcome collection for Cursor Agent usage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pymongo>=4.9,<5",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "mongomock>=4.1,<5",
    "ruff>=0.5,<1",
]
llm = [
    "httpx>=0.27,<1",
]
export = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<18",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
router = "cursor_model_router.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer.Option(...)/typer.Argument(...) in defaults is the required Typer idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test bodies favor readable literal payloads over strict line-length limits.
"tests/**" = ["E501"]
